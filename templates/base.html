<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volatility Scanner</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --red: #f85149; --green: #3fb950; --orange: #d29922; --purple: #bc8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 24px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  header a { color: var(--muted); text-decoration: none; padding: 4px 10px;
             border-radius: 6px; }
  header a.active, header a:hover { color: var(--text); background: #21262d; }
  main { padding: 20px 24px; max-width: 1280px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase;
       font-size: 11px; letter-spacing: .04em; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  tr:hover td { background: #1c2129; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px;
          font-size: 11px; margin: 1px 2px; }
  .pill.crit { background: #4d1418; color: var(--red); }
  .pill.high { background: #3d2c07; color: var(--orange); }
  .pill.med  { background: #10304d; color: var(--accent); }
  .neg { color: var(--red); } .pos { color: var(--green); }
  .score-hi { color: var(--red); font-weight: 700; }
  .score-md { color: var(--orange); font-weight: 600; }
  .muted { color: var(--muted); }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
         flex-wrap: wrap; }
  .tabs a { padding: 6px 14px; border: 1px solid var(--border); color: var(--muted);
            text-decoration: none; }
  .tabs a:first-child { border-radius: 6px 0 0 6px; }
  .tabs a:last-child { border-radius: 0 6px 6px 0; }
  .tabs a.active { background: var(--accent); color: #08131f; border-color: var(--accent); }
  button { background: var(--green); border: 0; color: #04150a; font-weight: 600;
           padding: 7px 16px; border-radius: 6px; cursor: pointer; }
  button:disabled { background: var(--border); color: var(--muted); cursor: wait; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>📡 Volatility Scanner</h1>
  <a href="/" class="{{ 'active' if request.path == '/' }}">Dashboard</a>
  <a href="/alerts" class="{{ 'active' if request.path == '/alerts' }}">Alerts</a>
  <span style="flex:1"></span>
  <span class="muted" id="clock"></span>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleString();
  }, 1000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
